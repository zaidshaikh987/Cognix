[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognix"
version = "0.1.0.dev0"
description = "A domain-agnostic, uncertainty-aware multi-agent AI decision framework"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "COGNIX Contributors"}]
requires-python = ">=3.10"
keywords = ["uncertainty", "multi-agent", "bayesian", "conformal", "epistemic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "torch>=2.0",
    "pettingzoo>=1.24",
    "shap>=0.43",
    "lime>=0.2",
    "scikit-learn>=1.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
graph = ["torch>=2.0", "torch-geometric>=2.3"]
vision = ["torch>=2.0", "torchvision>=0.15", "Pillow>=9.0"]
explainability = ["shap>=0.43", "lime>=0.2"]
carla = ["carla>=0.9.15"]
llm = ["openai>=1.0", "anthropic>=0.20"]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.28", "websockets>=12.0", "httpx>=0.27"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/cognix-framework/cognix"
Repository = "https://github.com/cognix-framework/cognix"
Documentation = "https://cognix.readthedocs.io"
Issues = "https://github.com/cognix-framework/cognix/issues"

[project.scripts]
cognix = "cognix.cli:main"

[tool.setuptools.packages.find]
where = ["."]  
include = ["cognix*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
